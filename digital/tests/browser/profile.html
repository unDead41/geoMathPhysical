<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoDecoder — QA Profil Saya</title><link rel="stylesheet" href="../../dist/style.css"><link rel="stylesheet" href="../../dist/portal.css"><body><header class="site-header"><a class="brand" href="#">GeoDecoder Digital</a><span>Ujian profil · data simulasi</span></header><main class="app-shell"><p>Fixture pelayar menggunakan portal sebenar; sambungan akaun disimulasikan.</p><div class="dialog-actions"><button class="button button-outline" id="guest">Tetamu</button><button class="button button-outline" id="student">Murid</button><button class="button button-outline" id="teacher">Guru</button><button class="button button-outline" id="failure">Simpan gagal</button><button class="button button-outline" id="success">Simpan berjaya</button><button class="button button-outline" id="theme">Tukar tema</button></div><section id="portal-screen" hidden></section></main><script type="module">
import {createPortal} from '../../dist/portal.mjs';
let profile={id:'qa-student',username:'ijamm_qa',display_name:'Ijamm',role:'student',avatar:'cube',email:'ijamm@example.test',email_verified:true},fail=false,sessionListener;
const cloud={ready:true,session:{user:{id:profile.id}},async auth(){},onSessionChange(fn){sessionListener=fn;return()=>{};},async rpc(action,payload){if(action==='update_profile'){await new Promise(resolve=>setTimeout(resolve,900));if(fail)throw Error('Sambungan gagal. Draf anda dikekalkan. Cuba simpan semula.');profile={...profile,...payload};}return {profile:{...profile},classes:[{id:'qa-class',name:'2 STEM Cemerlang',teacher_name:'Cikgu Hana',members:[]}],rooms:[],invites:[],server_now:new Date().toISOString()};}};
const portal=createPortal({cloud});await portal.open({profile:true});
for(const role of ['student','teacher','guest'])document.getElementById(role).onclick=async()=>{portal.close();profile={...profile,id:'qa-'+role,role:role==='teacher'?'teacher':'student'};cloud.session=role==='guest'?null:{user:{id:profile.id}};await portal.open({profile:true});};
document.getElementById('failure').onclick=()=>{fail=true;};document.getElementById('success').onclick=()=>{fail=false;};document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
</script></body></html>
