name: GeoMath Flutter

on:
  push:
    branches: [app-foundation]
    paths:
      - 'apps/geomath_flutter/tools/android/capture_evidence.py'
      - '.github/workflows/geomath-flutter.yml'

permissions:
  contents: read
  actions: read

jobs:
  capture-verified-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify unchanged tested application
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          app=pathlib.Path('.')
          source='f5aeddd58d81e490b1e67b8bf4a21311645d3631'
          changed=subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          allowed=['.github/workflows/geomath-flutter.yml','apps/geomath_flutter/tools/android/capture_evidence.py','apps/geomath_flutter/tools/android/capture_verified_apk.sh']
          assert all(p in allowed or p.startswith('apps/geomath_flutter/docs/') for p in changed),changed
          r=json.loads((app/'docs/FOUNDATION_READY.json').read_text())
          for name,want in r['runtime_files'].items():
              assert hashlib.sha256((app/name).read_bytes()).hexdigest()==want,name
          print('All101 frozen runtime files match the application fully verified by CI41973098124.')
          PY
      - name: Prepare emulator storage
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -exec sudo rm -rf -- {} +
          df -h / "$RUNNER_TEMP" "$ANDROID_HOME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the tested normal APK
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_ACTIONS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/13390878421/zip" \
            -o "$RUNNER_TEMP/verified-apk.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'verified-apk.zip'
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()=='754e866ba82c46c49894a3a3815109b019e2ea4286bb0acc953a6b9e9486f7b0'
          apk=root/'geomath-main-debug.apk'
          with zipfile.ZipFile(archive) as z:
              assert z.namelist()==['app-debug.apk']
              with z.open('app-debug.apk') as src,apk.open('wb') as dst:shutil.copyfileobj(src,dst)
          assert hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()=='ae533c5f573adee45304a732dd4d9f39840f84da71ace0fc4c2035aea0dd213d'
          checked=0
          with zipfile.ZipFile(apk) as z:
              for p in pathlib.Path('assets').rglob('*'):
                  if p.is_file() and p.name!='.gitattributes':
                      assert z.read('assets/flutter_assets/'+p.as_posix())==p.read_bytes(),str(p)
                      checked+=1
          assert checked==20
          print('Exact CI41973098124 normal APK verified;172051208 bytes;20 matching bundled assets.')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the verified normal APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMPDIR: ${{ runner.temp }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          working-directory: apps/geomath_flutter
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/capture_verified_apk.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-android-capture
          path: apps/geomath_flutter/docs/handoffs/app-foundation/evidence/android-capture
          if-no-files-found: error
          retention-days: 7
