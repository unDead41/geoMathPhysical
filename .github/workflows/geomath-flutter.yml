name: GeoMath Flutter

on:
  push:
    branches: [app-foundation, app-learning, app-cloud-game, app-integration, app]
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  pull_request:
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: geomath-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  # Diagnostic markers never form a publication gate. The targeted follow-up
  # can complete the unchanged-runtime composite policy only with its baseline.
  # All other events run the full suite.
  GEOMATH_ANDROID_SUITE: ${{ contains(github.event.head_commit.message, '[android-followup:bootstrap-fix]') && 'bootstrap-fix' || contains(github.event.head_commit.message, '[android-diagnostic:module-spike]') && 'module-spike' || contains(github.event.head_commit.message, '[android-diagnostic:runtime-bootstrap]') && 'runtime-bootstrap' || contains(github.event.head_commit.message, '[android-followup:solo-captures]') && 'solo-followup' || 'full' }}
  GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx512m'

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[android-followup:production-captures]') }}
    name: "${{ contains(github.event.head_commit.message, '[android-followup:bootstrap-fix]') && 'Bootstrap fix (real WebView + production captures)' || contains(github.event.head_commit.message, '[android-followup:solo-captures]') && 'Android follow-up (Solo + production captures)' || contains(github.event.head_commit.message, '[android-diagnostic:') && 'Android diagnostic only' || 'verify' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Android disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          # Unused runtimes on this disposable hosted runner; retain Java,
          # Flutter and the Android tools required by this isolated app job.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          if [[ -d /opt/hostedtoolcache/CodeQL ]]; then
            sudo du -sx --block-size=1 /opt/hostedtoolcache/CodeQL
            sudo rm -rf -- /opt/hostedtoolcache/CodeQL
          fi
          # Flutter 3.47.9 resolves flutter.ndkVersion to 28.2.13676358.
          # This job builds only GeoMath; image-default NDK 27/30 are unused.
          if [[ -d "$ANDROID_HOME/ndk" ]]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -exec du -sh {} +
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d \
              ! -name '28.2.13676358' \
              -print -exec sudo rm -rf -- {} +
          fi
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        id: flutter-setup
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: geomath-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock') }}
      # Cache public dependencies only. Do not persist Gradle properties,
      # sessions, app databases, APKs, native transforms or source build outputs.
      - name: Restore Android build dependencies
        id: gradle-dependencies
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/wrapper/**/*.lck
          key: geomath-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock', 'apps/geomath_flutter/android/**/*.gradle*', 'apps/geomath_flutter/android/gradle.properties', 'apps/geomath_flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Toolchain
        run: |
          flutter --version
          flutter doctor -v
          nproc
          free -h
      - name: Dependencies
        run: flutter pub get
      - name: Save resolved Dart dependencies
        if: steps.flutter-setup.outputs.PUB-CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.flutter-setup.outputs.PUB-CACHE-PATH }}
          # Match flutter-action's internal cache key including its lock hash.
          key: ${{ steps.flutter-setup.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
      - name: Initialize Android engine cache
        run: flutter precache --android
      - name: Save initialized Flutter SDK
        if: steps.flutter-setup.outputs.CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.flutter-setup.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-setup.outputs.CACHE-KEY }}
      - name: Restore verified native SQLite downloads
        id: sqlite-native
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: apps/geomath_flutter/.dart_tool/hooks_runner/shared/sqlite3/build/download-*/libsqlite3.so
          key: geomath-sqlite-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock', 'apps/geomath_flutter/tools/android/prefetch_sqlite_assets.py') }}
      - name: Verify and prefetch pinned SQLite binaries
        run: |
          python3 -m unittest discover -s tools/android -p 'test_*.py'
          python3 -m unittest discover -s tools/android/tests -p 'test_*.py'
          python3 tools/android/prefetch_sqlite_assets.py --receipt docs/handoffs/app-integration/evidence/android/sqlite-native-assets.json
      - name: Save verified native SQLite downloads
        if: steps.sqlite-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: apps/geomath_flutter/.dart_tool/hooks_runner/shared/sqlite3/build/download-*/libsqlite3.so
          key: ${{ steps.sqlite-native.outputs.cache-primary-key }}
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        if: env.GEOMATH_ANDROID_SUITE == 'full'
        run: flutter test
      - name: Canonical source and adapter checks
        run: node --test tools/contracts/verify_exports.test.mjs test/foundation/native_adapter_contract.test.mjs test/features/learning/bundle/*.test.mjs test/features/learning/surface/*.test.mjs test/features/learning/studio/checkpoint_schema_parity.test.mjs
      - name: Debug APK
        if: env.GEOMATH_ANDROID_SUITE == 'full' || env.GEOMATH_ANDROID_SUITE == 'bootstrap-fix'
        id: debug-apk
        run: flutter build apk --debug
      # Preserve verified Maven/wrapper downloads even if the APK step fails.
      # The failed build outcome remains failed; this is only a download cache.
      - name: Save Android build dependencies
        if: ${{ !cancelled() && steps.gradle-dependencies.outputs.cache-hit != 'true' && steps.debug-apk.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/wrapper/**/*.lck
          key: ${{ steps.gradle-dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: env.GEOMATH_ANDROID_SUITE == 'full' || env.GEOMATH_ANDROID_SUITE == 'bootstrap-fix'
        with:
          name: geomath-debug-apk
          path: apps/geomath_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Release mode APK (development signing)
        if: env.GEOMATH_ANDROID_SUITE == 'full'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        if: env.GEOMATH_ANDROID_SUITE == 'full'
        with:
          name: geomath-release-mode-apk
          path: apps/geomath_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the normal application APK
        if: env.GEOMATH_ANDROID_SUITE == 'full' || env.GEOMATH_ANDROID_SUITE == 'bootstrap-fix'
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/geomath-main-debug.apk"
          test -s "$RUNNER_TEMP/geomath-main-debug.apk"
          # The normal APK is uploaded and preserved; integration repackages it.
          rm -f -- build/app/outputs/apk/debug/app-debug.apk
          # Release native build daemons before allocating the emulator.
          (cd android && ./gradlew --stop)
      - name: Reuse the exact verified production APK for targeted follow-up
        if: env.GEOMATH_ANDROID_SUITE == 'solo-followup'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: 13435485632
          run-id: 42066617435
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/geomath-followup-main
      - name: Verify runtime equivalence and reused APK hash
        if: env.GEOMATH_ANDROID_SUITE == 'solo-followup'
        run: |
          python3 - <<'PY_REUSE'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path('../..').resolve()
          baseline=json.loads(pathlib.Path('docs/handoffs/app-integration/evidence/local/runtime-reuse-baseline.json').read_text())
          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream,'sha256').hexdigest()
          tracked=subprocess.check_output(['git','ls-files','-z'],cwd=root).decode().split('\0')
          prefixes=('apps/geomath_flutter/lib/','apps/geomath_flutter/assets/','apps/geomath_flutter/android/')
          runtime={p for p in tracked if p.startswith(prefixes) or p in ('apps/geomath_flutter/pubspec.yaml','apps/geomath_flutter/pubspec.lock')}
          expected={x['path'] for x in baseline['runtime_files']}
          assert runtime==expected, 'Runtime file inventory differs from verified baseline.'
          assert len(runtime)==170
          for item in baseline['runtime_files']:
              assert sha(root/item['path'])==item['sha256'], item['path']
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'geomath-followup-main/app-debug.apk'
          assert sha(apk)==baseline['normal_ci_apk_sha256'], 'Reused APK hash mismatch.'
          shutil.copyfile(apk,pathlib.Path(os.environ['RUNNER_TEMP'])/'geomath-main-debug.apk')
          evidence=pathlib.Path('docs/handoffs/app-integration/evidence/android');evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'verified-runtime-reuse.json').write_text(json.dumps({
              'schema_version':1,'baseline_run_id':baseline['baseline_run_id'],
              'baseline_source':baseline['baseline_source'],
              'current_source':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'runtime_files_verified':170,'runtime_equivalent':True,
              'normal_apk_sha256':baseline['normal_ci_apk_sha256'],
              'full_publish_gate':False,
              'scope':'Targeted corrected Solo test and normal APK captures; combine only with the recorded unchanged-runtime baseline checks.',
          },indent=2)+'\n')
          print('Verified 170 unchanged runtime files and exact baseline normal APK hash.')
          PY_REUSE
      - name: Prebuild the Android integration APK
        run: |
          case "$GEOMATH_ANDROID_SUITE" in
            full) integration_target=integration_test/integration_smoke_test.dart ;;
            module-spike) integration_target=integration_test/module_spike_test.dart ;;
            bootstrap-fix) integration_target=integration_test/module_spike_test.dart ;;
            runtime-bootstrap) integration_target=integration_test/integration_smoke_test.dart ;;
            solo-followup) integration_target=integration_test/solo_reopen_test.dart ;;
            *) echo 'Unsupported diagnostic suite' >&2; exit 2 ;;
          esac
          # Functional WebView tests keep the normal Flutter surface lifetime.
          # Actual pictures come from the separate normal-main ADB capture gate.
          flutter build apk --debug --target-platform android-x64 -t "$integration_target" --dart-define=LEARNING_SCREENSHOTS=false
          mv build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/geomath-integration-debug.apk"
          test -s "$RUNNER_TEMP/geomath-integration-debug.apk"
          rm -f -- build/app/outputs/apk/debug/app-debug.apk
          (cd android && ./gradlew --stop)
      - name: Android disk headroom
        shell: bash
        run: |
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['ANDROID_HOME']).free
          # Project budget for image extraction, AVD and a second native build.
          minimum = 20 * 1024 ** 3
          if free < minimum:
              raise SystemExit(f'Android runner needs {minimum} free bytes; found {free}')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android WebView smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMPDIR: ${{ runner.temp }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          working-directory: apps/geomath_flutter
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/run_integration_smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-android-evidence
          path: apps/geomath_flutter/docs/handoffs/app-integration/evidence/android
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: env.GEOMATH_ANDROID_SUITE == 'full'
        with:
          name: geomath-android-smoke-apk
          path: ${{ runner.temp }}/geomath-main-debug.apk
          if-no-files-found: error
          retention-days: 7

  production_capture:
    name: Production APK capture follow-up (unchanged runtime)
    if: contains(github.event.head_commit.message, '[android-followup:production-captures]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture tooling checks
        run: |
          bash -n tools/android/run_production_capture.sh
          python3 -m py_compile tools/android/inspect_learning_failure.py tools/android/capture_integration.py
          python3 -m unittest discover -s tools/android -p 'test_*.py'
          python3 -m unittest discover -s tools/android/tests -p 'test_*.py'
      - name: Download exact baseline normal APK
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: 13435485632
          run-id: 42066617435
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/geomath-followup-main
      - name: Verify all runtime paths and binary SHA
        run: |
          python3 - <<'PY_REUSE'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path('../..').resolve()
          baseline=json.loads(pathlib.Path('docs/handoffs/app-integration/evidence/local/runtime-reuse-baseline.json').read_text())
          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream,'sha256').hexdigest()
          tracked=subprocess.check_output(['git','ls-files','-z'],cwd=root).decode().split('\0')
          prefixes=('apps/geomath_flutter/lib/','apps/geomath_flutter/assets/','apps/geomath_flutter/android/')
          runtime={p for p in tracked if p.startswith(prefixes) or p in ('apps/geomath_flutter/pubspec.yaml','apps/geomath_flutter/pubspec.lock')}
          expected={x['path'] for x in baseline['runtime_files']}
          assert runtime==expected, 'Runtime file inventory differs from verified baseline.'
          assert len(runtime)==170
          for item in baseline['runtime_files']:
              assert sha(root/item['path'])==item['sha256'], item['path']
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'geomath-followup-main/app-debug.apk'
          assert sha(apk)==baseline['normal_ci_apk_sha256'], 'Reused APK hash mismatch.'
          shutil.copyfile(apk,pathlib.Path(os.environ['RUNNER_TEMP'])/'geomath-main-debug.apk')
          evidence=pathlib.Path('docs/handoffs/app-integration/evidence/android');evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'verified-runtime-reuse.json').write_text(json.dumps({
              'schema_version':1,'baseline_run_id':baseline['baseline_run_id'],
              'baseline_source':baseline['baseline_source'],
              'current_source':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'runtime_files_verified':170,'runtime_equivalent':True,
              'normal_apk_sha256':baseline['normal_ci_apk_sha256'],
              'full_publish_gate':False,
              'scope':'Production capture only; combine with baseline functional cases and separately passed corrected Solo case.',
          },indent=2)+'\n')
          print('Verified 170 unchanged runtime files and exact baseline normal APK hash.')
          PY_REUSE
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the installed normal APK offline
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMPDIR: ${{ runner.temp }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
          GEOMATH_NORMAL_APK: ${{ runner.temp }}/geomath-main-debug.apk
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          working-directory: apps/geomath_flutter
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/run_production_capture.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-production-capture-evidence
          path: apps/geomath_flutter/docs/handoffs/app-integration/evidence/android
          if-no-files-found: error
          retention-days: 7
