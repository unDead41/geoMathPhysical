name: GeoMath Flutter

on:
  push:
    branches: [app-foundation, app-learning, app-cloud-game, app-integration, app]
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  pull_request:
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geomath-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx512m'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Android disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          # Unused runtimes on this disposable hosted runner; retain Java,
          # Flutter and the Android tools required by this isolated app job.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          if [[ -d /opt/hostedtoolcache/CodeQL ]]; then
            sudo du -sx --block-size=1 /opt/hostedtoolcache/CodeQL
            sudo rm -rf -- /opt/hostedtoolcache/CodeQL
          fi
          # Flutter 3.47.9 resolves flutter.ndkVersion to 28.2.13676358.
          # This job builds only GeoMath; image-default NDK 27/30 are unused.
          if [[ -d "$ANDROID_HOME/ndk" ]]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -exec du -sh {} +
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d \
              ! -name '28.2.13676358' \
              -print -exec sudo rm -rf -- {} +
          fi
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: geomath-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock') }}
      - name: Toolchain
        run: |
          flutter --version
          flutter doctor -v
          nproc
          free -h
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Canonical source and adapter checks
        run: node --test tools/contracts/verify_exports.test.mjs test/foundation/native_adapter_contract.test.mjs
      - name: Debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: geomath-debug-apk
          path: apps/geomath_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the normal application APK
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/geomath-main-debug.apk"
          test -s "$RUNNER_TEMP/geomath-main-debug.apk"
          # The normal APK is uploaded and preserved; integration repackages it.
          rm -f -- build/app/outputs/apk/debug/app-debug.apk
          # Release native build daemons before allocating the emulator.
          (cd android && ./gradlew --stop)
      - name: Prebuild the Android integration APK
        run: |
          flutter build apk --debug --target-platform android-x64 -t integration_test/foundation_smoke_test.dart
          mv build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/geomath-integration-debug.apk"
          test -s "$RUNNER_TEMP/geomath-integration-debug.apk"
          rm -f -- build/app/outputs/apk/debug/app-debug.apk
          (cd android && ./gradlew --stop)
      - name: Android disk headroom
        shell: bash
        run: |
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['ANDROID_HOME']).free
          # Project budget for image extraction, AVD and a second native build.
          minimum = 20 * 1024 ** 3
          if free < minimum:
              raise SystemExit(f'Android runner needs {minimum} free bytes; found {free}')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android WebView smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMPDIR: ${{ runner.temp }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          working-directory: apps/geomath_flutter
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/run_smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-android-evidence
          path: apps/geomath_flutter/docs/handoffs/app-foundation/evidence/android
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: geomath-android-smoke-apk
          path: ${{ runner.temp }}/geomath-main-debug.apk
          if-no-files-found: error
          retention-days: 7
