name: GeoMath Flutter

on:
  push:
    branches: [app-foundation, app-learning, app-cloud-game, app-integration, app]
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  pull_request:
    paths:
      - 'apps/geomath_flutter/**'
      - '.github/workflows/geomath-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geomath-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx512m'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: geomath-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock') }}
      - name: Toolchain
        run: |
          flutter --version
          flutter doctor -v
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Canonical source and adapter checks
        run: node --test tools/contracts/verify_exports.test.mjs test/foundation/native_adapter_contract.test.mjs
      - name: Debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: geomath-debug-apk
          path: apps/geomath_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/geomath_flutter
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Android disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          # Unused runtimes on this disposable hosted runner; retain Java,
          # Flutter and the complete Android SDK required by native plugins.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: geomath-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/geomath_flutter/pubspec.lock') }}
      - name: Dependencies
        run: flutter pub get
      - name: Preserve the normal application APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/geomath-main-debug.apk"
      - name: Android disk headroom
        shell: bash
        run: |
          df -h / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          df -i / /tmp "$RUNNER_TEMP" "$ANDROID_HOME"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['ANDROID_HOME']).free
          # Project budget for image extraction, AVD and a second native build.
          minimum = 20 * 1024 ** 3
          if free < minimum:
              raise SystemExit(f'Android runner needs {minimum} free bytes; found {free}')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android WebView smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMPDIR: ${{ runner.temp }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          working-directory: apps/geomath_flutter
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            flutter devices
            adb shell dumpsys webviewupdate
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = '1'
            flutter test integration_test -d emulator-5554
            flutter run --no-pub --no-resident --use-application-binary="$RUNNER_TEMP/geomath-main-debug.apk" -d emulator-5554
            python3 tools/android/capture_evidence.py --device emulator-5554 --output docs/handoffs/app-foundation/evidence/android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-android-evidence
          path: apps/geomath_flutter/docs/handoffs/app-foundation/evidence/android
          if-no-files-found: ignore
          retention-days: 7
