name: Retire migrated GeoMath branches
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geomath-source-retirement
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify destinations, archive originals and retire migrated branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 migration/retire_migrated_branches.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-branch-retirement-receipt
          path: migration/retirement-receipt.json
          if-no-files-found: ignore
