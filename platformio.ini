; GeoDecoder - buka folder repo ini dalam VS Code + PlatformIO IDE.
[platformio]
default_envs = esp32dev-sharing
extra_configs = platformio.local.ini

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@1.4.12
    duinoWitchery/hd44780@1.3.2
upload_speed = 115200
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
monitor_dtr = 0
monitor_rts = 0
; Port dikesan secara automatik. Jika perlu, tetapkan dalam platformio.local.ini.

; LED biasa, sama seperti tetapan asal dalam ZIP.
[env:esp32dev-sharing]
build_flags = -DGEODECODER_RGB_ENABLED=0

; Pilih environment ini apabila kedua-dua RGB empat kaki telah dipasang.
[env:esp32dev-sharing-rgb]
build_flags = -DGEODECODER_RGB_ENABLED=1
